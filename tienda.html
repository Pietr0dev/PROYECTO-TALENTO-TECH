<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
</head>
<body>
    <header>
        <div id="titulo">Tu carrito - Realizá tu pedido</div>
        <br>
        <button id="btnPagar" onclick="pagar()">Pagar</button>
        <button id="btnLimpiar" onclick="limpiarCarrito()">Vaciar Carrito</button>
    </header>
    <main>
        <section>
            <div class="tarjeta">
                <h3>Marketing digital</h3> 
                <h2>$ 350 USD.-</h2>
                <button id="btnComprar" onclick="agregarProducto('Marketing digial', 350)">Comprar</button>
            </div>
        </section>
        <section>
            <div class="tarjeta">
                <h3>Diseño Gráfico</h3>
                <h2>$ 800.-</h2>
                <button id="btnComprar" onclick="agregarProducto('Diseño gráfico', 800)">Comprar</button>
            </div>
        </section>
        <section>
            <div class="tarjeta">
                <h3>Diseño web y apps</h3>
                <h2>$ 1500.-</h2>
                <button id="btnComprar" onclick="agregarProducto('Diseño web, app', 1500)">Comprar</button>
            </div>
        </section>
    </main>
    <div id="carrito"></div>

    <footer></footer>

    <script src="tienda.js"> </script> 
</body>
</html>
